<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#102a43">
    <title>Grand Horizon | Luxury Resort & Spa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>try{var t=localStorage.getItem("gh.theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>
      :root {
        --navy: #102a43;
        --navy-deep: #0b2034;
        --ink: #183247;
        --muted: #5b6b77;
        --sand: #f4f1eb;
        --cream: #fbfaf7;
        --gold: #b68b52;
        --gold-text: #86602d;
        --focus: #86602d;
        --line: #dddcd7;
        --white: #fff;
        --surface: #ffffff;
        --heading: #102a43;
        --line-soft: #eeeeee;
        --on-gold: #ffffff;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --cream: #0e1b28;
        --sand: #0a1520;
        --ink: #d9e2e8;
        --muted: #a3b3be;
        --line: #27404f;
        --line-soft: #1f3443;
        --surface: #142637;
        --heading: #f2ece1;
        --gold-text: #d9b37c;
        --on-gold: #0b2034;
        --focus: #ddbd89;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--cream); font-family: "DM Sans", sans-serif; font-size: 15px; line-height: 1.5; }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }
      .container { width: min(1160px, calc(100% - 64px)); margin: 0 auto; }
      
      /* Cabeçalho */
      .site-header { position: absolute; z-index: 5; top: 0; left: 0; width: 100%; color: #fff; border-bottom: 1px solid rgba(255,255,255,.22); }
      .nav-wrap { height: 86px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark { width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.75); display: grid; place-items: center; font-family: "Playfair Display", serif; font-size: 13px; letter-spacing: .04em; }
      .brand strong, .brand small { display: block; line-height: 1.1; }
      .brand strong { font-size: 13px; letter-spacing: .17em; font-weight: 600; }
      .brand small { font-size: 8px; letter-spacing: .24em; margin-top: 5px; color: rgba(255,255,255,.85); }
      .main-nav { display: flex; align-items: center; gap: 32px; font-size: 12px; letter-spacing: .04em; }
      .main-nav > a:not(.nav-cta) { opacity: .82; }
      .nav-cta { border: 1px solid rgba(255,255,255,.55); padding: 12px 17px; }
      .nav-cta [aria-hidden="true"], .button [aria-hidden="true"] { margin-left: 12px; }
      .menu-toggle { display: none; background: none; color: #fff; border: 0; font-size: 24px; cursor: pointer; min-width: 44px; min-height: 44px; }
      
      /* Banner Hero */
      .hero { height: 690px; position: relative; color: #fff; background-image: url("https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=2000&q=90"); background-size: cover; background-position: center; }
      .hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,28,46,.83) 0%, rgba(9,32,49,.45) 52%, rgba(9,32,49,.12) 100%); }
      .hero-content { position: relative; z-index: 1; padding-top: 225px; }
      .eyebrow { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-text); font-weight: 700; margin: 0 0 22px; }
      .eyebrow.light { color: #ddbd89; }
      .hero h1 { font: 600 clamp(42px, 6vw, 75px)/1.03 "Playfair Display", serif; letter-spacing: -.035em; margin: 0 0 25px; }
      .hero h1 em, h1 em, h2 em { font-weight: 500; }
      .hero-copy { max-width: 430px; color: rgba(255,255,255,.8); font-size: 16px; line-height: 1.8; margin: 0 0 34px; }
      .button { display: inline-flex; align-items: center; justify-content: space-between; padding: 15px 22px; border: 0; text-transform: uppercase; font-size: 10px; letter-spacing: .14em; font-weight: 700; cursor: pointer; transition: .25s; }
      .button:hover { transform: translateY(-2px); }
      .button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
      .button-light { background: #fff; color: var(--navy); }
      .button-gold { background: var(--gold-text); color: var(--on-gold); }
      .button-outline { border: 1px solid var(--gold-text); color: var(--ink); background: transparent; }
      .hero-scroll { position: absolute; z-index: 1; right: 32px; bottom: 38px; transform: rotate(-90deg); transform-origin: right center; text-transform: uppercase; font-size: 9px; letter-spacing: .2em; color: rgba(255,255,255,.7); }
      .hero-scroll span { display: inline-block; width: 48px; height: 1px; background: var(--gold); margin-right: 14px; vertical-align: middle; }
      
      /* Barra de Reservas */
      .booking-bar { background: var(--navy); color: #fff; padding: 27px 0 22px; }
      .booking-inner { display: flex; align-items: center; gap: 40px; }
      .booking-intro { display: flex; align-items: center; gap: 12px; min-width: 145px; font-family: "Playfair Display", serif; line-height: 1.2; font-size: 18px; }
      .gold-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: block; }
      .booking-form { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1.2fr auto; gap: 15px; align-items: end; flex: 1; }
      .booking-form label { display: flex; flex-direction: column; text-transform: uppercase; font-size: 9px; letter-spacing: .14em; color: #aeb9c0; gap: 7px; }
      .booking-form input, .booking-form select { background: transparent; color: #fff; border: 0; border-bottom: 1px solid rgba(255,255,255,.35); padding: 4px 0 10px; outline: 0; min-width: 0; }
      .booking-form select option { color: var(--ink); background: var(--surface); }
      .booking-form input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .7; }
      .booking-form .button { min-height: 42px; white-space: nowrap; }
      .booking-hint { width: min(1160px, calc(100% - 64px)); margin: 12px auto 0; color: #ddbd89; font-size: 11px; text-align: right; min-height: 16px; }
      
      /* Seções Principais */
      .section-pad { padding-top: 112px; padding-bottom: 112px; }
      .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .17em; color: var(--muted); display: flex; align-items: center; gap: 13px; }
      .section-label span { color: var(--gold-text); }
      .section-label i { width: 27px; height: 1px; background: var(--gold); display: inline-block; }
      .intro-grid { display: grid; grid-template-columns: 1.25fr .8fr; gap: 100px; margin-top: 50px; }
      .intro-grid h2, .section-heading h2, .experience-copy h2 { font: 500 clamp(36px, 4.2vw, 55px)/1.08 "Playfair Display", serif; letter-spacing: -.03em; color: var(--heading); margin: 0; }
      .intro-text { padding-top: 14px; color: var(--muted); font-size: 15px; line-height: 1.9; }
      .text-link { display: inline-flex; gap: 13px; margin-top: 24px; color: var(--heading); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .15em; border-bottom: 1px solid var(--gold); padding-bottom: 9px; }
      
      /* Quartos */
      .rooms-section { background: var(--sand); }
      .section-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 42px; }
      .section-heading .eyebrow { margin-bottom: 16px; }
      .section-index { font-size: 10px; letter-spacing: .17em; color: var(--muted); padding-bottom: 7px; }
      .rooms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .room-card { background: var(--surface); }
      .room-image { height: 325px; position: relative; overflow: hidden; }
      .room-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
      .room-card:hover img { transform: scale(1.05); }
      .room-category { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,.9); padding: 7px 10px; text-transform: uppercase; font-size: 9px; letter-spacing: .14em; color: var(--navy); }
      .image-arrow { position: absolute; right: 19px; top: 19px; width: 32px; height: 32px; background: var(--gold); color: #fff; display: grid; place-items: center; }
      .room-info { padding: 21px 22px 19px; }
      .room-info h3 { font: 500 24px "Playfair Display", serif; margin: 0 0 9px; color: var(--heading); }
      .room-info p { font-size: 12px; line-height: 1.65; color: var(--muted); min-height: 60px; margin: 0; }
      .room-meta { display: flex; justify-content: space-between; align-items: end; border-top: 1px solid var(--line); margin-top: 19px; padding-top: 15px; font-size: 10px; color: var(--muted); }
      .room-meta strong { font-size: 16px; color: var(--heading); }
      .room-meta small { font-size: 9px; font-weight: 400; color: var(--muted); }
      
      /* Experiência / Spa */
      .experience-section { background: var(--cream); }
      .experience-grid { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 90px; }
      .experience-image { height: 520px; }
      .experience-image img { width: 100%; height: 100%; object-fit: cover; }
      .experience-copy h2 { margin: 0 0 22px; }
      .experience-copy p { max-width: 390px; color: var(--muted); line-height: 1.9; margin: 0 0 30px; }
      
      /* Citação */
      .quote-section { background: var(--navy); color: #fff; padding: 96px 0; text-align: center; }
      .quote-mark { color: var(--gold); font: 70px/0 "Playfair Display", serif; }
      .quote-section blockquote { max-width: 700px; margin: 22px auto 20px; font: 500 clamp(28px, 4vw, 45px)/1.2 "Playfair Display", serif; }
      .quote-section p { color: #9daab4; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
      
      /* Rodapé */
      .site-footer { background: var(--navy-deep); color: #fff; padding: 65px 0 25px; }
      .footer-top { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; padding-bottom: 58px; }
      .footer-title { font-weight: 400; color: var(--gold); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; margin: 0 0 15px; }
      .footer-top > div > a { display: block; color: #bac4ca; font-size: 13px; margin: 5px 0; }
      .footer-brand { align-self: start; }
      .socials { display: flex; gap: 9px; }
      .socials a { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.25); display: grid !important; place-items: center; font-size: 9px !important; color: #fff !important; }
      .footer-bottom { border-top: 1px solid rgba(255,255,255,.15); padding-top: 21px; display: flex; justify-content: space-between; color: #83929e; font-size: 10px; }
      .footer-bottom a { color: #d8b57e; }
      
      /* Mensagens / Notificações (Flash) */
      .flash-stack { position: fixed; z-index: 10; top: 95px; right: 24px; width: min(420px, calc(100% - 48px)); }
      .flash { box-shadow: 0 9px 30px rgba(0,0,0,.12); padding: 16px 42px 16px 18px; position: relative; margin-bottom: 10px; font-size: 13px; animation: slideIn 0.3s ease-out; }
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      .flash.success { background: #e6f3ec; color: #1c6844; border-left: 3px solid #3d9b6b; }
      .flash.error { background: #f9e9e7; color: #98463c; border-left: 3px solid #c5685d; }
      .flash button { position: absolute; right: 9px; top: 8px; width: 28px; height: 28px; line-height: 1; border: 0; background: transparent; font-size: 21px; cursor: pointer; color: inherit; }
      
      /* Painel de Administração Integrado */
      .admin-section { padding: 90px 0; background: var(--sand); border-top: 1px solid var(--line); }
      .admin-title { display: flex; align-items: end; justify-content: space-between; margin-bottom: 38px; }
      .admin-title h2 { font: 500 42px "Playfair Display", serif; color: var(--heading); margin: 0; }
      .admin-date { font-size: 10px; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; }
      .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 45px; }
      .stat-card { background: var(--surface); border: 1px solid var(--line); padding: 24px 25px; }
      .stat-card.stat-accent { background: var(--navy); color: #fff; border-color: var(--navy); }
      .stat-label, .stat-foot { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
      .stat-accent .stat-label, .stat-accent .stat-foot { color: #aeb9c0; }
      .stat-card strong { display: block; font: 500 32px "Playfair Display", serif; color: var(--heading); margin: 18px 0 12px; }
      .stat-accent strong { color: #fff; }
      .stat-foot { font-size: 10px; text-transform: none; letter-spacing: 0; }
      .status { font-family: "DM Sans", sans-serif !important; font-size: 22px !important; }
      .status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #54a878; vertical-align: middle; margin-right: 7px; }
      .reservations-panel { background: var(--surface); border: 1px solid var(--line); }
      .panel-heading { display: flex; align-items: end; justify-content: space-between; padding: 27px 28px; border-bottom: 1px solid var(--line); }
      .panel-heading h3 { margin: 0; font: 500 30px "Playfair Display", serif; color: var(--heading); }
      .panel-heading .eyebrow { margin-bottom: 9px; }
      .panel-heading > span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
      th { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .13em; font-weight: 600; }
      th, td { padding: 17px 20px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
      td { color: var(--ink); }
      td strong, td small { display: block; }
      td small { color: var(--muted); font-size: 10px; margin-top: 3px; }
      .empty-state { text-align: center; padding: 60px 20px; }
      .empty-state > span { font-size: 27px; color: var(--gold); }
      .empty-state h4 { font: 500 24px "Playfair Display", serif; color: var(--heading); margin: 14px 0 4px; }
      .empty-state p { color: var(--muted); margin: 0; }

      /* Responsividade */
      @media (max-width: 900px) {
        .main-nav { display: none; }
        .main-nav.is-open { display: flex; position: absolute; top: 72px; left: 20px; right: 20px; padding: 20px; background: var(--navy); flex-direction: column; align-items: stretch; }
        .menu-toggle { display: block; }
        .booking-inner { flex-direction: column; align-items: stretch; }
        .booking-form { grid-template-columns: 1fr; }
        .intro-grid { grid-template-columns: 1fr; gap: 30px; }
        .rooms-grid { grid-template-columns: 1fr; }
        .experience-grid { grid-template-columns: 1fr; gap: 40px; }
        .stats-grid { grid-template-columns: 1fr; }
        .footer-top { grid-template-columns: 1fr; }
      }

      /* ===== Acessibilidade (WCAG 2.2 AA) ===== */
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      .skip-link { position: absolute; z-index: 100; left: 16px; top: -60px; background: #fff; color: var(--navy); padding: 12px 18px; font-weight: 700; }
      .skip-link:focus { top: 12px; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      .site-header, .booking-bar, .quote-section, .site-footer, .stat-accent { --focus: #ddbd89; }
      .booking-form input::placeholder { color: #aeb9c0; opacity: 1; }
      .booking-form input[aria-invalid="true"], .booking-form select[aria-invalid="true"] { border-bottom-color: #ffb4a8; }
      .field-error { color: #ffb4a8; font-size: 11px; letter-spacing: 0; text-transform: none; min-height: 0; }
      .booking-hint, .booking-intro h2 { margin-bottom: 0; }
      .booking-intro h2 { margin: 0; font: inherit; }
      .header-tools { display: flex; align-items: center; gap: 12px; }
      .lang-switch { display: flex; border: 1px solid rgba(255,255,255,.4); }
      .lang-switch button { background: none; border: 0; color: #fff; padding: 6px 10px; min-width: 36px; min-height: 32px; font-size: 11px; letter-spacing: .08em; cursor: pointer; }
      .lang-switch button[aria-pressed="true"] { background: #fff; color: var(--navy); font-weight: 700; }

      /* ===== LGPD ===== */
      .form-consents { grid-column: 1 / -1; display: grid; gap: 8px; }
      .booking-form .consent { flex-direction: row; align-items: flex-start; gap: 10px; text-transform: none; letter-spacing: 0; font-size: 12px; color: #d5dde2; }
      .booking-form .consent input { flex: none; width: 20px; height: 20px; padding: 0; border: 0; accent-color: var(--gold); }
      .consent a { color: #ddbd89; text-decoration: underline; }
      .link-button { background: none; border: 0; padding: 0; color: #d8b57e; text-decoration: underline; cursor: pointer; font-size: inherit; }
      .panel-tools > span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
      .panel-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: flex-end; }
      .tool-btn { border: 1px solid var(--muted); background: var(--surface); color: var(--heading); font-size: 11px; padding: 6px 12px; min-height: 32px; cursor: pointer; }
      .tool-btn[aria-pressed="true"] { background: var(--navy); color: #fff; }
      .table-wrap:focus-visible { outline-offset: -3px; }
      dialog.privacy { width: min(640px, calc(100% - 32px)); max-height: 85vh; border: 0; padding: 0; color: var(--ink); background: var(--surface); }
      dialog.privacy::backdrop { background: rgba(11,32,52,.72); }
      .privacy-body { padding: 32px; max-height: 85vh; overflow: auto; }
      .privacy-body h2 { font: 500 30px "Playfair Display", serif; color: var(--heading); margin: 0 0 8px; }
      .privacy-body dt { font-weight: 700; color: var(--heading); margin-top: 16px; }
      .privacy-body dd { margin: 4px 0 0; color: var(--muted); line-height: 1.7; }
      .privacy-body .button { margin-top: 24px; }

      /* ===== Tema claro/escuro ===== */
      .theme-toggle { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; min-width: 36px; min-height: 34px; font-size: 15px; cursor: pointer; }
      .theme-toggle[aria-pressed="true"] { background: #fff; color: var(--navy); }
      :root[data-theme="dark"] .room-image img, :root[data-theme="dark"] .experience-image img { filter: brightness(.88); }

      /* ===== Modo mobile ===== */
      @media (max-width: 900px) {
        .hero { height: auto; min-height: 600px; padding-bottom: 90px; }
        .hero-content { padding-top: 170px; }
        .hero-scroll { display: none; }
        .main-nav.is-open { max-height: calc(100vh - 100px); overflow: auto; border: 1px solid rgba(255,255,255,.2); gap: 4px; }
        .main-nav.is-open a { padding: 12px 4px; }
        .main-nav.is-open .nav-cta { padding: 14px 17px; text-align: center; margin-top: 8px; }
        .section-pad { padding-top: 80px; padding-bottom: 80px; }
        .admin-title, .section-heading { flex-wrap: wrap; gap: 12px; }
      }
      @media (max-width: 700px) {
        .table-wrap { overflow-x: visible; }
        table, tbody, tr, td { display: block; }
        thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
        tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
        td { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border: 0; padding: 7px 20px; white-space: normal; text-align: right; }
        td::before { content: attr(data-label); flex: none; text-align: left; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
      }
      @media (max-width: 600px) {
        .container, .booking-hint { width: calc(100% - 32px); }
        .booking-hint { text-align: left; }
        .nav-wrap { height: 72px; }
        .header-tools { gap: 8px; }
        .lang-switch button { min-width: 32px; padding: 4px 6px; }
        .theme-toggle, .menu-toggle { min-width: 40px; }
        .hero { min-height: 540px; }
        .hero-content { padding-top: 140px; }
        .hero h1 { font-size: clamp(36px, 11vw, 46px); margin-bottom: 20px; }
        .hero-copy { font-size: 15px; margin-bottom: 26px; }
        .hero .button { width: 100%; }
        .booking-bar { padding: 24px 0 18px; }
        .booking-inner { gap: 20px; }
        .booking-intro { min-width: 0; }
        .booking-form input, .booking-form select { font-size: 16px; padding: 8px 0 10px; }
        .booking-form .button { width: 100%; min-height: 48px; }
        .section-pad { padding-top: 60px; padding-bottom: 60px; }
        .intro-grid { margin-top: 32px; }
        .room-image { height: 240px; }
        .experience-image { height: 300px; }
        .quote-section { padding: 64px 0; }
        .admin-section { padding: 56px 0; }
        .admin-title h2 { font-size: 32px; }
        .panel-heading { flex-direction: column; align-items: flex-start; gap: 14px; padding: 22px 20px; }
        .panel-tools { justify-content: flex-start; }
        .tool-btn { min-height: 40px; }
        .stat-card { padding: 20px; }
        .empty-state { padding: 44px 20px; }
        .site-footer { padding: 48px 0 calc(24px + env(safe-area-inset-bottom)); }
        .footer-top { gap: 28px; padding-bottom: 36px; }
        .footer-bottom { flex-direction: column; gap: 12px; }
        .socials a { width: 44px; height: 44px; }
        .flash-stack { top: 80px; right: 16px; width: calc(100% - 32px); }
        .privacy-body { padding: 22px 20px; max-height: 90vh; }
        dialog.privacy { max-height: 90vh; }
      }
      @media (max-width: 480px) {
        .brand > span:last-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>

        </div>
        <div class="hero-scroll" aria-hidden="true"><span></span> <b style="font-weight:400" data-i18n="hero.scroll"></b></div>
      </section>

      <!-- Formulário de Reservas -->
      <section class="booking-bar" id="booking" aria-labelledby="booking-title">
        <div class="container booking-inner">
          <div class="booking-intro">
            <span class="gold-dot" aria-hidden="true"></span>
            <h2 id="booking-title"><strong><span data-i18n="booking.title1"></span><br><span data-i18n="booking.title2"></span></strong></h2>
          </div>
          <form class="booking-form" id="bookingForm" novalidate>
            <label for="guest_name"><span data-i18n="booking.name"></span>
              <input type="text" id="guest_name" name="name" autocomplete="name" maxlength="120" required aria-required="true" aria-describedby="err_guest_name" data-i18n-attr="placeholder:booking.namePh">
              <span class="field-error" id="err_guest_name"></span>
            </label>
            <label for="email"><span data-i18n="booking.email"></span>
              <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required aria-required="true" aria-describedby="err_email" data-i18n-attr="placeholder:booking.emailPh">
              <span class="field-error" id="err_email"></span>
            </label>
            <label for="room_id"><span data-i18n="booking.room"></span>
              <select id="room_id" required aria-required="true" aria-describedby="err_room_id"></select>
              <span class="field-error" id="err_room_id"></span>
            </label>
            <label for="check_in"><span data-i18n="booking.in"></span>
              <input type="date" id="check_in" required aria-required="true" aria-describedby="err_check_in bookingHint">
              <span class="field-error" id="err_check_in"></span>
            </label>
            <label for="check_out"><span data-i18n="booking.out"></span>
              <input type="date" id="check_out" required aria-required="true" aria-describedby="err_check_out bookingHint">
              <span class="field-error" id="err_check_out"></span>
            </label>
            <button class="button button-gold" type="submit" id="submitBtn"><span id="submitLabel"></span> <span aria-hidden="true">→</span></button>

            <div class="form-consents">
              <label class="consent" for="privacy_ack">
                <input type="checkbox" id="privacy_ack" required aria-required="true" aria-describedby="err_privacy_ack">
                <span data-i18n-html="consent.privacy"></span>
              </label>
              <span class="field-error" id="err_privacy_ack"></span>
              <label class="consent" for="marketing_optin">
                <input type="checkbox" id="marketing_optin">
                <span data-i18n="consent.marketing"></span>
              </label>
            </div>
          </form>
        </div>
        <div class="booking-hint" id="bookingHint" role="status" aria-live="polite"></div>
      </section>

      <!-- A Experiência -->
      <section class="intro-section container section-pad" id="experience" aria-labelledby="experience-title">

          <div>
            <p class="eyebrow" data-i18n="intro.eyebrow"></p>
            <h2 id="experience-title"><span data-i18n="intro.h2a"></span><br><em data-i18n="intro.h2b"></em></h2>
          </div>
          <div class="intro-text">
            <p data-i18n="intro.p"></p>
            <a class="text-link" href="#rooms"><span data-i18n="intro.link"></span> <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </section>

      <!-- Acomodações -->

            <div>

            </div>
            <span class="section-index" aria-hidden="true">02 / 04</span>
          </div>
          <div class="rooms-grid" id="roomsContainer"></div>
        </div>
      </section>

      <!-- Spa & Bem-estar -->
      <section class="experience-section section-pad" id="spa" aria-labelledby="spa-title">

          <div class="experience-image">

              <span class="stat-foot" data-i18n="admin.statCountFoot"></span>

              <span class="stat-foot" data-i18n="admin.statRevFoot"></span>

              <span class="stat-foot" data-i18n="admin.statusFoot"></span>
            </div>
          </div>

            <div class="panel-heading">
              <div>

                <h3 data-i18n="admin.panelTitle"></h3>
              </div>
              <div class="panel-tools">
                <span id="reservationCountLabel" role="status"></span>
                <button type="button" class="tool-btn" id="revealBtn" aria-pressed="false" data-i18n="admin.reveal"></button>

              </div>
            </div>

                <caption class="sr-only" data-i18n="admin.caption"></caption>
                <thead role="rowgroup">

                    <th role="columnheader" scope="col" data-i18n="admin.colRoom"></th>
                    <th role="columnheader" scope="col" data-i18n="admin.colStay"></th>

                    <th role="columnheader" scope="col" data-i18n="admin.colAt"></th>
                    <th role="columnheader" scope="col" data-i18n="admin.colActions"></th>

      /* ===================================================
         UTILITÁRIOS
         =================================================== */

      // Cria elementos DOM sem usar innerHTML (evita XSS com dados do usuário)
      function h(tag, props = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === false || value == null) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else node.setAttribute(key, value === true ? "" : value);
        }
        node.append(...children);
        return node;
      }

      const $ = (selector, root = document) => root.querySelector(selector);

      class SafeStorage {
        static get(key) { try { return localStorage.getItem(key); } catch { return null; } }
        static set(key, value) { try { localStorage.setItem(key, value); } catch { /* armazenamento indisponível */ } }
      }

      class DateUtils {
        static parse(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
        static toISO(date) {
          const p = (n) => String(n).padStart(2, "0");
          return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
        }
        static today() { return DateUtils.toISO(new Date()); }
        static addDays(iso, n) { const d = DateUtils.parse(iso); d.setDate(d.getDate() + n); return DateUtils.toISO(d); }
        static nights(checkIn, checkOut) {
          return Math.max(0, Math.round((DateUtils.parse(checkOut) - DateUtils.parse(checkIn)) / 86400000));
        }
        // Duas reservas se chocam se a entrada for antes do check-out existente E a saída for depois do check-in existente
        static overlaps(inA, outA, inB, outB) { return inA < outB && outA > inB; }
      }

      /* ===================================================
         INTERNACIONALIZAÇÃO E FORMATAÇÃO
         =================================================== */

      class I18n {
        static FALLBACK = "pt-BR";
        #dict; #lang = I18n.FALLBACK; #listeners = [];

        constructor(dict) { this.#dict = dict; }
        get lang() { return this.#lang; }
        get supported() { return Object.keys(this.#dict); }

        detect() {
          const saved = SafeStorage.get("gh.lang");
          if (saved && this.#dict[saved]) return saved;
          const nav = (navigator.language || "").toLowerCase();
          if (nav.startsWith("en")) return "en";
          if (nav.startsWith("es")) return "es";
          return I18n.FALLBACK;
        }

        set(lang, persist = true) {
          if (!this.#dict[lang]) return;
          this.#lang = lang;
          document.documentElement.lang = lang;
          if (persist) SafeStorage.set("gh.lang", lang); // só grava quando o usuário escolhe o idioma
          this.#listeners.forEach((fn) => fn(lang));
        }

        onChange(fn) { this.#listeners.push(fn); }

        t(key, params = {}) {
          const value = this.#dict[this.#lang]?.[key] ?? this.#dict[I18n.FALLBACK][key] ?? key;
          if (typeof value !== "string") return value;
          return value.replace(/\{(\w+)\}/g, (_, k) => params[k] ?? "");
        }

        // Aplica traduções aos elementos marcados com data-i18n, data-i18n-html e data-i18n-attr
        apply(root = document) {
          root.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = this.t(n.dataset.i18n); });
          root.querySelectorAll("[data-i18n-html]").forEach((n) => { n.innerHTML = this.t(n.dataset.i18nHtml); }); // somente strings do dicionário (confiáveis)
          root.querySelectorAll("[data-i18n-attr]").forEach((n) => {
            n.dataset.i18nAttr.split(";").forEach((pair) => {
              const [attr, key] = pair.split(":");
              n.setAttribute(attr, this.t(key));
            });
          });
          document.title = this.t("meta.title");
        }
      }

      class Formatter {
        #i18n;
        constructor(i18n) { this.#i18n = i18n; }
        currency(value) { return new Intl.NumberFormat(this.#i18n.lang, { style: "currency", currency: "BRL" }).format(value); }
        date(iso) { return iso ? new Intl.DateTimeFormat(this.#i18n.lang).format(DateUtils.parse(iso)) : ""; }
        dateTime(ts) { return new Intl.DateTimeFormat(this.#i18n.lang, { dateStyle: "short", timeStyle: "short" }).format(ts); }
      }

      /* ===================================================
         MODELOS E REPOSITÓRIO
         =================================================== */

      class Room {
        constructor({ id, name, categoryKey, descriptionKey, price, capacity, image }) {
          Object.assign(this, { id, name, categoryKey, descriptionKey, price, capacity, image });
          Object.freeze(this);
        }
      }

      class Reservation {
        constructor({ room, guestName, email, checkIn, checkOut, marketingConsent = false }) {
          this.id = Date.now() + Math.floor(Math.random() * 1000);
          this.roomId = room.id;
          this.roomName = room.name;
          this.roomCategoryKey = room.categoryKey;
          this.guestName = guestName;
          this.email = email;
          this.checkIn = checkIn;
          this.checkOut = checkOut;
          this.total = room.price * DateUtils.nights(checkIn, checkOut);
          this.createdAt = Date.now();
          this.privacyNoticeAckAt = this.createdAt; // registro da ciência do Aviso de Privacidade
          this.marketingConsent = marketingConsent;   // consentimento específico e opcional
        }
        get nights() { return DateUtils.nights(this.checkIn, this.checkOut); }
      }

      class ReservationRepository {
        #items = [];
        get count() { return this.#items.length; }
        all() { return [...this.#items]; }
        add(reservation) { this.#items.unshift(reservation); }
        remove(id) {
          const index = this.#items.findIndex((r) => r.id === id);
          return index >= 0 ? this.#items.splice(index, 1)[0] : null;
        }
        byRoom(roomId) { return this.#items.filter((r) => r.roomId === roomId); }
        totalRevenue() { return this.#items.reduce((sum, r) => sum + r.total, 0); }
        findConflict(roomId, checkIn, checkOut) {
          return this.byRoom(roomId).find((r) => DateUtils.overlaps(checkIn, checkOut, r.checkIn, r.checkOut)) ?? null;
        }
        // Próxima reserva a partir do check-in escolhido (limita a data máxima de saída)
        nextBlockedDate(roomId, checkIn) {
          const starts = this.byRoom(roomId).map((r) => r.checkIn).filter((d) => d >= checkIn).sort();
          return starts[0] ?? null;
        }
      }

      class BookingService {
        #rooms; #repo;
        constructor(rooms, repo) { this.#rooms = rooms; this.#repo = repo; }
        rooms() { return this.#rooms; }
        getRoom(id) { return this.#rooms.find((r) => r.id === id) ?? null; }

        validate(input, fmt) {
          const errors = [];
          const add = (field, key, params) => errors.push({ field, key, params });
          const room = this.getRoom(input.roomId);

          if (input.guestName.length < 2) add("guest_name", "err.name");
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.email)) add("email", "err.email");
          if (!room) add("room_id", "err.roomNotFound");
          if (!input.checkIn) add("check_in", "err.in");
          else if (input.checkIn < DateUtils.today()) add("check_in", "err.inPast");
          if (!input.checkOut) add("check_out", "err.out");
          else if (input.checkIn && DateUtils.nights(input.checkIn, input.checkOut) <= 0) add("check_out", "err.dateOrder");

          if (room && !errors.some((e) => e.field.startsWith("check_"))) {
            const conflict = this.#repo.findConflict(room.id, input.checkIn, input.checkOut);
            if (conflict) add("check_in", "err.unavailable", { room: room.name, from: fmt.date(conflict.checkIn), to: fmt.date(conflict.checkOut) });
          }
          if (!input.privacyAck) add("privacy_ack", "err.privacy");
          return errors;
        }

        book(input) {
          const room = this.getRoom(input.roomId);
          const reservation = new Reservation({ room, guestName: input.guestName, email: input.email, checkIn: input.checkIn, checkOut: input.checkOut, marketingConsent: input.marketingOptIn });
          this.#repo.add(reservation);
          return reservation;
        }

        cancel(id) { return this.#repo.remove(id); }
      }

      /* ===================================================
         VIEWS E CONTROLADORES
         =================================================== */

      class NotificationCenter {
        #stack; #i18n;
        constructor(stack, i18n) { this.#stack = stack; this.#i18n = i18n; }
        show(message, type = "success") {
          const close = h("button", { type: "button", "aria-label": this.#i18n.t("flash.close"), text: "×" });
          const flash = h("div", { class: `flash ${type}`, role: type === "error" ? "alert" : "status" }, h("span", { text: message }), close);
          close.addEventListener("click", () => flash.remove());
          this.#stack.append(flash);
          if (type !== "error") setTimeout(() => flash.remove(), 8000); // erros permanecem até serem fechados
        }
      }

      class RoomsView {
        #service; #i18n; #fmt; #container; #select;
        constructor({ service, i18n, fmt }) {
          this.#service = service; this.#i18n = i18n; this.#fmt = fmt;
          this.#container = $("#roomsContainer"); this.#select = $("#room_id");
        }
        render() {
          const t = this.#i18n.t.bind(this.#i18n);
          const selected = this.#select.value;
          this.#container.replaceChildren();
          this.#select.replaceChildren();
          for (const room of this.#service.rooms()) {
            const titleId = `room-title-${room.id}`;
            this.#container.append(
              h("article", { class: "room-card", "aria-labelledby": titleId },
                h("div", { class: "room-image" },
                  h("img", { src: room.image, alt: t("rooms.alt", { name: room.name }), loading: "lazy" }),
                  h("span", { class: "room-category", text: t(room.categoryKey) }),
                  h("span", { class: "image-arrow", "aria-hidden": "true", text: "↗" })),
                h("div", { class: "room-info" },
                  h("div", {}, h("h3", { id: titleId, text: room.name }), h("p", { text: t(room.descriptionKey) })),
                  h("div", { class: "room-meta" },
                    h("span", { text: t("rooms.upTo", { n: room.capacity }) }),
                    h("strong", {}, `${this.#fmt.currency(room.price)} `, h("small", { text: t("rooms.night") }))))));
            this.#select.append(h("option", { value: room.id, text: `${room.name} (${this.#fmt.currency(room.price)}${t("booking.perNight")})` }));
          }
          if (selected) this.#select.value = selected;
        }
      }

      class AdminView {
        #repo; #i18n; #fmt; #notifier; #service; #revealEmails = false;
        constructor({ repo, service, i18n, fmt, notifier, onChange }) {
          this.#repo = repo; this.#service = service; this.#i18n = i18n; this.#fmt = fmt; this.#notifier = notifier;

          $("#revealBtn").addEventListener("click", (e) => {
            this.#revealEmails = !this.#revealEmails;
            e.currentTarget.setAttribute("aria-pressed", String(this.#revealEmails));
            this.render();
          });
          $("#exportBtn").addEventListener("click", () => this.#export());
          $("#reservationsTableBody").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-id]");
            if (!btn || !window.confirm(this.#i18n.t("admin.deleteConfirm"))) return;
            this.#service.cancel(Number(btn.dataset.id)); // direito de eliminação (LGPD, art. 18, VI)
            this.#notifier.show(this.#i18n.t("admin.deleted"));
            onChange();
          });
        }

        // Minimização de exposição: e-mail mascarado por padrão
        #maskEmail(email) {
          if (this.#revealEmails) return email;
          const [local, domain] = email.split("@");
          return `${local.charAt(0)}***@${domain}`;
        }

        // Portabilidade de dados (LGPD, art. 18, V)
        #export() {
          const t = this.#i18n.t.bind(this.#i18n);
          const data = this.#repo.all();
          if (!data.length) { this.#notifier.show(t("admin.exportEmpty"), "error"); return; }
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const link = h("a", { href: URL.createObjectURL(blob), download: "reservas-grand-horizon.json" });
          document.body.append(link); link.click(); link.remove();
          URL.revokeObjectURL(link.href);
          this.#notifier.show(t("admin.exported"));
        }

        render() {
          const t = this.#i18n.t.bind(this.#i18n);
          const reservations = this.#repo.all();
          const count = reservations.length;

          $("#statCount").textContent = count;
          $("#statRevenue").textContent = this.#fmt.currency(this.#repo.totalRevenue());
          $("#reservationCountLabel").textContent = t(count === 1 ? "admin.rec.one" : "admin.rec.other", { n: count });
          $("#emptyState").hidden = count > 0;

          $("#reservationsTableBody").replaceChildren(...reservations.map((r) =>
            h("tr", { role: "row" },
              h("td", { role: "cell", "data-label": t("admin.colGuest") }, h("div", {}, h("strong", { text: r.guestName }), h("small", { text: this.#maskEmail(r.email) }))),
              h("td", { role: "cell", "data-label": t("admin.colRoom") }, h("div", {}, r.roomName, h("small", { text: t(r.roomCategoryKey) }))),
              h("td", { role: "cell", "data-label": t("admin.colStay"), text: `${this.#fmt.date(r.checkIn)} — ${this.#fmt.date(r.checkOut)}` }),
              h("td", { role: "cell", "data-label": t("admin.colTotal") }, h("strong", { text: this.#fmt.currency(r.total) })),
              h("td", { role: "cell", "data-label": t("admin.colAt"), text: this.#fmt.dateTime(r.createdAt) }),
              h("td", { role: "cell", "data-label": t("admin.colActions") }, h("button", { type: "button", class: "tool-btn", "data-id": r.id, "aria-label": t("admin.deleteAria", { name: r.guestName }), text: t("admin.delete") })))));
        }
      }

      class BookingFormController {
        #service; #repo; #i18n; #fmt; #notifier; #onBooked; #busy = false;
        #form; #btn; #label; #hint; #fields;

        constructor({ service, repo, i18n, fmt, notifier, onBooked }) {
          this.#service = service; this.#repo = repo; this.#i18n = i18n; this.#fmt = fmt; this.#notifier = notifier; this.#onBooked = onBooked;
          this.#form = $("#bookingForm"); this.#btn = $("#submitBtn"); this.#label = $("#submitLabel"); this.#hint = $("#bookingHint");
          this.#fields = Object.fromEntries(["guest_name", "email", "room_id", "check_in", "check_out", "privacy_ack", "marketing_optin"].map((id) => [id, $(`#${id}`)]));

          const today = DateUtils.today();
          this.#fields.check_in.min = today;
          this.#fields.check_out.min = today;

          this.#fields.check_in.addEventListener("change", () => this.updateConstraints());
          this.#fields.room_id.addEventListener("change", () => this.updateConstraints());
          this.#form.addEventListener("submit", (e) => { e.preventDefault(); this.#submit(); });
        }

        render() {
          this.#label.textContent = this.#i18n.t(this.#busy ? "booking.processing" : "booking.submit");
          this.updateConstraints();
        }

        // Limites dinâmicos do check-out conforme o check-in e as reservas existentes
        updateConstraints() {
          const { check_in: inEl, check_out: outEl, room_id: roomEl } = this.#fields;
          this.#hint.textContent = "";
          if (!inEl.value) { outEl.min = inEl.min; outEl.removeAttribute("max"); return; }

          const minOut = DateUtils.addDays(inEl.value, 1);
          outEl.min = minOut;
          const blocked = this.#repo.nextBlockedDate(Number(roomEl.value), inEl.value);

          if (blocked) {
            outEl.max = blocked;
            this.#hint.textContent = this.#i18n.t("booking.hintBusy", { date: this.#fmt.date(blocked) });
          } else {
            outEl.removeAttribute("max");
          }
          if (outEl.value && (outEl.value < minOut || (blocked && outEl.value > blocked))) outEl.value = "";
        }

        #clearErrors() {
          for (const [id, el] of Object.entries(this.#fields)) {
            el.removeAttribute("aria-invalid");
            const msg = $(`#err_${id}`);
            if (msg) msg.textContent = "";
          }
        }

        #showErrors(errors) {
          for (const { field, key, params } of errors) {
            this.#fields[field].setAttribute("aria-invalid", "true");
            const msg = $(`#err_${field}`);
            if (msg && !msg.textContent) msg.textContent = this.#i18n.t(key, params);
          }
          this.#fields[errors[0].field].focus();
          this.#notifier.show(this.#i18n.t(errors[0].key, errors[0].params), "error");
        }

        #submit() {
          if (this.#busy) return;
          this.#clearErrors();
          const f = this.#fields;
          const input = {
            guestName: f.guest_name.value.trim(), email: f.email.value.trim(), roomId: parseInt(f.room_id.value, 10),
            checkIn: f.check_in.value, checkOut: f.check_out.value, privacyAck: f.privacy_ack.checked, marketingOptIn: f.marketing_optin.checked
          };
          const errors = this.#service.validate(input, this.#fmt);
          if (errors.length) { this.#showErrors(errors); return; }

          // Bloqueio de envio duplo
          this.#busy = true;
          this.#btn.disabled = true;
          this.#btn.setAttribute("aria-busy", "true");
          this.render();

          setTimeout(() => {
            const reservation = this.#service.book(input);
            this.#onBooked();
            this.#notifier.show(this.#i18n.t("ok.booked", { room: reservation.roomName, total: this.#fmt.currency(reservation.total) }));
            this.#form.reset();
            this.#busy = false;
            this.#btn.disabled = false;
            this.#btn.removeAttribute("aria-busy");
            this.render();
            this.#btn.focus();
          }, 400);
        }
      }

      class NavController {
        #i18n; #toggle; #nav;
        constructor(i18n) {
          this.#i18n = i18n; this.#toggle = $("#menuToggle"); this.#nav = $("#mainNav");
          this.#toggle.addEventListener("click", () => this.#set(!this.isOpen));
          this.#nav.addEventListener("click", (e) => { if (e.target.closest("a")) this.#set(false); });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && this.isOpen) { this.#set(false); this.#toggle.focus(); }
          });
        }
        get isOpen() { return this.#nav.classList.contains("is-open"); }
        #set(open) {
          this.#nav.classList.toggle("is-open", open);
          this.#toggle.setAttribute("aria-expanded", String(open));
          this.render();
        }
        render() { this.#toggle.setAttribute("aria-label", this.#i18n.t(this.isOpen ? "nav.close" : "nav.open")); }
      }

      class LanguageSwitcher {
        #i18n; #buttons;
        constructor(i18n) {
          this.#i18n = i18n;
          this.#buttons = [...document.querySelectorAll("[data-lang]")];
          this.#buttons.forEach((b) => b.addEventListener("click", () => i18n.set(b.dataset.lang)));
        }
        render() { this.#buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === this.#i18n.lang))); }
      }

      class ThemeController {
        #i18n; #btn; #meta; #mq;
        constructor(i18n) {
          this.#i18n = i18n; this.#btn = $("#themeToggle"); this.#meta = $('meta[name="theme-color"]');
          this.#mq = window.matchMedia("(prefers-color-scheme: dark)");
          this.#apply(document.documentElement.dataset.theme || (this.#mq.matches ? "dark" : "light"));
          this.#btn.addEventListener("click", () => {
            const next = this.theme === "dark" ? "light" : "dark";
            this.#apply(next);
            SafeStorage.set("gh.theme", next); // só grava quando o usuário escolhe
            this.render();
          });
          this.#mq.addEventListener("change", (e) => {
            if (!SafeStorage.get("gh.theme")) { this.#apply(e.matches ? "dark" : "light"); this.render(); }
          });
        }
        get theme() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
        #apply(theme) {
          document.documentElement.dataset.theme = theme;
          this.#meta?.setAttribute("content", theme === "dark" ? "#0a1520" : "#102a43");
        }
        render() {
          const label = this.#i18n.t("theme.toggle");
          this.#btn.setAttribute("aria-pressed", String(this.theme === "dark"));
          this.#btn.setAttribute("aria-label", label);
          this.#btn.title = label;
        }
      }

      class PrivacyDialog {
        #i18n; #dialog; #list;
        constructor(i18n) {
          this.#i18n = i18n; this.#dialog = $("#privacyDialog"); this.#list = $("#privacyList");
          document.addEventListener("click", (e) => {
            if (e.target.closest("[data-open-privacy]")) { e.preventDefault(); this.open(); }
          });
          $("#privacyClose").addEventListener("click", () => this.#dialog.close());
          this.#dialog.addEventListener("click", (e) => { if (e.target === this.#dialog) this.#dialog.close(); });
        }
        open() { this.#dialog.showModal(); }
        render() {
          this.#list.replaceChildren(...this.#i18n.t("privacy.items").flatMap(([title, text]) => [h("dt", { text: title }), h("dd", { text })]));
        }
      }

      /* ===================================================
         APLICAÇÃO
         =================================================== */

      class App {
        constructor() {
          this.i18n = new I18n(TRANSLATIONS);
          this.fmt = new Formatter(this.i18n);
          this.repo = new ReservationRepository();
          this.service = new BookingService(ROOMS_DATA.map((r) => new Room(r)), this.repo);
          this.notifier = new NotificationCenter($("#flash-stack"), this.i18n);

          this.roomsView = new RoomsView({ service: this.service, i18n: this.i18n, fmt: this.fmt });
          this.adminView = new AdminView({ repo: this.repo, service: this.service, i18n: this.i18n, fmt: this.fmt, notifier: this.notifier, onChange: () => this.#refreshData() });
          this.form = new BookingFormController({ service: this.service, repo: this.repo, i18n: this.i18n, fmt: this.fmt, notifier: this.notifier, onBooked: () => this.#refreshData() });
          this.nav = new NavController(this.i18n);
          this.lang = new LanguageSwitcher(this.i18n);
          this.theme = new ThemeController(this.i18n);
          this.privacy = new PrivacyDialog(this.i18n);
        }

        #refreshData() { this.adminView.render(); this.form.updateConstraints(); }

        render() {
          const year = new Date().getFullYear();
          this.i18n.apply();
          $("#copyrightYear").textContent = this.i18n.t("footer.copy", { year });
          $("#adminYearDisplay").textContent = this.i18n.t("admin.date", { year });
          // O slogan do rodapé está em inglês: marca o idioma da parte (WCAG 3.1.2)
          const tagline = $("#tagline");
          if (this.i18n.lang === "pt-BR") tagline.setAttribute("lang", "en"); else tagline.removeAttribute("lang");
          this.roomsView.render();
          this.adminView.render();
          this.form.render();
          this.privacy.render();
          this.lang.render();
          this.theme.render();
          this.nav.render();
        }

        init() {
          this.i18n.onChange(() => this.render());
          this.i18n.set(this.i18n.detect(), false);
        }
      }

      document.addEventListener("DOMContentLoaded", () => new App().init());
    </script>
  </body>
